name: E2E (landing)

# Gates a PR on the landing page's golden-path E2E suite (landing/e2e/)
# running against a production build on the runner. Unlike merch-mockup/
# ebc-songs, this app has no database, auth, or serverless functions to
# diverge from a real deployment — it's a static marketing page — so a
# plain `next build && next start` is a faithful stand-in and needs no
# Vercel/Supabase secrets at all.
#
# Always triggers (no top-level `paths:` filter) — the `changes` job below
# decides whether landing/** actually changed, and every other job is
# skipped (not un-triggered) when it didn't. A required status check that
# never runs blocks merge indefinitely under this repo's ruleset; a job
# that runs and reports "skipped" satisfies it. This closes #90, which a
# root-README-only PR (#89) hit: the old `paths:`-filtered trigger meant
# "e2e"/"unit"/"lint" never ran at all for a change outside landing/** and
# intake/**, and there was no way through short of an admin bypass.

on:
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      landing: ${{ steps.filter.outputs.landing }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            landing:
              - 'landing/**'
              - '.github/workflows/e2e.yml'

  unit:
    # The ruleset requires a "unit" status check (also satisfied on
    # intake-only PRs by unit-intake.yml's job of the same name) — without
    # this job, a landing-only PR could never satisfy "unit" at all, which
    # is exactly what blocked PR #63 from merging. Mirrors "e2e", which
    # already works this way: both e2e.yml and e2e-intake.yml post a
    # same-named check, so either app's changes satisfy it standalone.
    # Runs Vitest (src/app/page.test.ts) over the page's content data and
    # constants — page.tsx has no other pure logic to unit-test.
    needs: changes
    if: needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run test

  lint:
    # Independently gated so a lint regression can't merge just because it
    # doesn't happen to break the build (see issue #62) — landing's ESLint
    # config existed but was never invoked in CI.
    needs: changes
    if: needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run lint

  e2e:
    needs: changes
    if: needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build

      - name: Start server
        # Output redirected to a file rather than left to inherit the step's
        # own stdout: GitHub Actions stops capturing a backgrounded (`&`)
        # process's output once the step that launched it exits. "Print
        # server log" below cats this file so it's visible regardless of
        # outcome.
        run: |
          npm run start > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ > /dev/null && exit 0
            sleep 1
          done
          echo "Server did not become ready in time" >&2
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright (Python)
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run E2E suite
        run: python e2e/run.py

      - name: Print server log
        if: always()
        run: cat /tmp/server.log
